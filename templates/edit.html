<!DOCTYPE html>
<html>
<head>
    <title>Edit Booking</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"> 
</head>
<body class="p-4">
    <h2>Edit Booking</h2>
    <form method="POST" onsubmit="return validateForm()"> 
        <div class="mb-3"><label>Name:</label><input type="text" name="name" value="{{ booking[1] }}" class="form-control"></div>
        <div class="mb-3">
            <label>Phone:</label>
            <input type="text" name="phone" id="phone" value="{{ booking[2] }}" class="form-control">
        </div>
        <div class="mb-3">
            <label>Email:</label>
            <input type="text" name="email" id="email" value="{{ booking[3] }}" class="form-control">
        </div>
        <div class="mb-3"><label>Property Size:</label><input type="text" name="property_size" value="{{ booking[4] }}" class="form-control"></div>
        <div class="mb-3"><label>Date:</label><input type="text" name="date" value="{{ booking[5] }}" class="form-control"></div>
        <div class="mb-3"><label>Pickup Address:</label><input type="text" name="pickup_address" value="{{ booking[6] }}" class="form-control"></div>
        <div class="mb-3"><label>Drop Address:</label><input type="text" name="drop_address" value="{{ booking[7] }}" class="form-control"></div>
        <button type="submit" class="btn btn-success">Update</button>
        <a href="/admin" class="btn btn-secondary">Cancel</a>
    </form>

    <script>
        function validateForm() {
            const phoneInput = document.getElementById('phone').value;
            const emailInput = document.getElementById('email').value;

            // Simple Email Regex
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            // Simple Phone Regex
            const phoneRegex = /^\s*(?:\+?(\d{1,3}))?[-. (]*(\d{3})[-. )]*(\d{3})[-. ]*(\d{4})(?: *x(\d+))?\s*$/;

            if (!emailRegex.test(emailInput)) {
                alert('Please enter a valid email address.');
                return false;
            }
            
            if (!phoneRegex.test(phoneInput)) {
                alert('Please enter a valid phone number (e.g., 555-555-5555).');
                return false;
            }

            return true;
        }
    </script>
    </body>
</html>
