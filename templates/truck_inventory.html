<!DOCTYPE html>
<html>
<head>
    <title>Truck Inventory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="container mt-4">
    <h2>🚚 Truck Inventory Management</h2>
    <form method="POST">
        <table class="table table-bordered mt-3">
            <thead class="text-bg-dark"> 
                <tr>
                    <th>Truck Type</th>
                    <th>Available</th>
                </tr>
            </thead>
            <tbody>
                {% for truck in trucks %}
                <tr>
                    <td>{{ truck["Truck Type"] }}</td>
                    <td>
                        <input type="number" name="available_{{ loop.index0 }}" value="{{ truck["Available"] }}" class="form-control" min="0">
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        <button type="submit" class="btn btn-success">💾 Update Inventory</button>
        <a href="/admin" class="btn btn-secondary ms-2">← Back to Dashboard</a>
    </form>
</body>
</html>
