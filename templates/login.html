<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="page-shell">
        <nav class="navbar navbar-expand-lg navbar-light top-nav">
            <div class="container">
                <a class="navbar-brand brand-logo" href="{{ url_for('home') }}">
                    <img src="{{ url_for('static', filename='label.png') }}" alt="True North Vanlines" class="brand-logo-image">
                </a>
                <a class="btn btn-outline-secondary" href="{{ url_for('home') }}">Back To Site</a>
            </div>
        </nav>

        <main class="container flex-grow-1 d-flex align-items-center justify-content-center">
            <div class="auth-card login-card reveal-up">
                <span class="eyebrow d-flex justify-content-center mx-auto">Secure admin access</span>
                <h1 class="section-title text-center">Admin Login</h1>
                <p class="text-center text-secondary mb-4">Access booking management, inventory, and truck assignment controls from a polished dashboard.</p>

                <div class="d-flex flex-wrap justify-content-center gap-2 mb-4">
                    <span class="badge-soft">Dashboard access</span>
                    <span class="badge-soft">Inventory control</span>
                    <span class="badge-soft">Export tools</span>
                </div>

                {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                {% endif %}

                <form method="POST" action="/login">
                    <div class="field-block">
                        <label class="form-label" for="username">Username</label>
                        <input id="username" name="username" class="form-control" required>
                    </div>
                    <div class="field-block">
                        <label class="form-label" for="password">Password</label>
                        <input id="password" name="password" type="password" class="form-control" required>
                    </div>
                    <button class="btn btn-brand w-100 mt-2">Login</button>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
